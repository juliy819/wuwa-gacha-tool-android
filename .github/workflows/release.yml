name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号，例如 1.1.0"
        required: true
        type: string
      draft:
        description: "创建为草稿 Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and update Gradle metadata
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z"; exit 1; }
          TAG="v$VERSION"
          git show-ref --tags --verify --quiet "refs/tags/$TAG" && { echo "tag already exists: $TAG"; exit 1; }
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["VERSION"]
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          parts = [int(x) for x in version.split('.')]
          code = parts[0] * 10000 + parts[1] * 100 + parts[2]
          text, count = re.subn(r"versionCode = \d+", f'versionCode = {code}', text, count=1)
          if count != 1:
              raise SystemExit("versionCode entry not found")
          text, count = re.subn(r"versionName = \"[^\"]+\"", f'versionName = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit("versionName entry not found")
          path.write_text(text)
          PY
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Commit version and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): bump version to ${TAG#v}"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
